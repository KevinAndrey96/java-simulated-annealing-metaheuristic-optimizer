name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  matrix-build:
    name: Java ${{ matrix.java-version }} Build & Verification
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: ['8', '11', '17', '21']

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile and Test with Maven
        run: mvn clean package -B

      - name: Run Architecture & Algorithm Verification Suite
        run: python3 scripts/verify_annealing.py

      - name: Run Headless Benchmark CLI Tests
        run: |
          java -jar target/simulated-annealing-optimizer.jar --benchmark linear --seed 42 --export-csv trajectory_linear.csv
          java -jar target/simulated-annealing-optimizer.jar --benchmark sphere --seed 42 --export-csv trajectory_sphere.csv
          java -jar target/simulated-annealing-optimizer.jar --benchmark rastrigin --seed 42
          java -jar target/simulated-annealing-optimizer.jar --benchmark rosenbrock --seed 42
          java -jar target/simulated-annealing-optimizer.jar --benchmark ackley --seed 42

      - name: Validate Docker Compose Configuration
        run: docker compose config --quiet
